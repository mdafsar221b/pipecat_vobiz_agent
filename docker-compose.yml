services:
  voice-agent:
    build: .
    container_name: swargaseema-voice-agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: swargaseema-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
